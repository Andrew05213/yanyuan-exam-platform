name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, types and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      RAYON_NUM_THREADS: '2'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare self-hosted OCR and build
        run: |
          node scripts/prepare-ocr.mjs
          pnpm run build
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Run isolated regression suites
        run: node scripts/verify-ci.mjs
      - name: Exercise admissions in desktop and mobile Chromium
        env:
          CHROME_BIN: google-chrome
        run: node scripts/verify_admissions_browser.mjs
